syntax = "proto3";

package polkadot;
option go_package = "./polkadot";
import "common.proto";

message Network {
    int32 ss58Format = 1;
    string provider  = 2;
}

message TransactionReply {
    string serialized             = 1;
    repeated Signature signatures = 2;
    string hash                   = 3;
    string estimated_fee          = 4;
    string call_hash              = 5;
    string call_hex               = 6;
    int32 weight                  = 7;
}

message DeployAccountRequest {
    string key      = 1;
    Network network = 2;
}

message DeployAccountReply {
    string address = 1;
}

message DeployMultisigAccountRequest {
    Network network      = 1;
    repeated string keys = 2;
    int32 threshold      = 3;
}

message DeployMultisigAccountReply {
    string address = 1;
}

message TransactionParams {
    int32 nonce      = 1;
    int32 max_weight = 2;
    int32 period     = 3;
    bool method_only = 4;
}

message BuildTransferRequest {
    Network network          = 1;
    string from              = 2;
    string to                = 3;
    string quantity          = 4;
    TransactionParams params = 5;
}

message BuildMultisigApproveAsMultiRequest {
    Network network          = 1;
    TransactionParams params = 2;
    repeated string pub_keys = 3;
    int32 threshold          = 4;
    string signer            = 5;
    string call_hash         = 6;
    string call_hex          = 7;
}

message BuildMultisigAsMultiRequest {
    Network network          = 1;
    TransactionParams params = 2;
    repeated string pub_keys = 3;
    int32 threshold          = 4;
    string signer            = 5;
    string call_hash         = 6;
    string call_hex          = 7;
}

message BuildMultisigCancelAsMultiRequest {
    Network network          = 1;
    TransactionParams params = 2;
    repeated string pub_keys = 3;
    int32 threshold          = 4;
    string signer            = 5;
    string call_hash         = 6;
    string call_hex          = 7;
}

message SignTransactionRequest {
    Network network               = 1;
    string serialized             = 2;
    repeated Signature signatures = 3;
}

message SendTransactionRequest {
    Network network   = 1;
    string serialized = 2;
}

message Recipient {
    string address = 1;
    string value   = 2;
}

message BuildBatchTransferTransactionRequest {
    Network network               = 1;
    repeated Recipient recipients = 2;
    string signer                 = 3;
    TransactionParams params      = 4;
}

message BuildBatchTransactionRequest {
    Network network          = 1;
    repeated string txs      = 2;
    string signer            = 3;
    TransactionParams params = 4;
}

message RebuildTransactionRequest {
    Network network          = 1;
    string serialized        = 2;
    TransactionParams params = 3;
}

message DecodeTransactionRequest {
    Network network   = 1;
    string serialized = 2;
}

message BuildStakingBondAndNominateTransactionRequest {
    Network network          = 1;
    TransactionParams params = 2;
    string quantity          = 3;
    repeated string targets  = 4;
    string controller        = 5;
    string from              = 6;
}

message BuildStakingBondExtraTransactionRequest {
    Network network          = 1;
    TransactionParams params = 2;
    string max_additional    = 3;
    string from              = 4;
}

message BuildStakingNominateTransactionRequest {
    Network network          = 1;
    TransactionParams params = 2;
    repeated string targets  = 3;
    string from              = 4;
}

message BuildStakingUnbondTransactionRequest {
    Network network          = 1;
    TransactionParams params = 2;
    string from              = 3;
    string quantity          = 4;
}

message BuildStakingWithdrawUnbondedTransactionRequest {
    Network network           = 1;
    TransactionParams params  = 2;
    string from               = 3;
    string num_slashing_spans = 4;
}

service Polkadot {
    rpc DeployAccount(DeployAccountRequest) returns (DeployAccountReply) {}
    rpc DeployMultisigAccount(DeployMultisigAccountRequest) returns (DeployMultisigAccountReply) {}
    rpc BuildTransferTransaction(BuildTransferRequest) returns (TransactionReply) {}
    rpc BuildMultisigApproveAsMultiTransaction(BuildMultisigApproveAsMultiRequest) returns (TransactionReply) {}
    rpc BuildMultisigAsMultiTransaction(BuildMultisigAsMultiRequest) returns (TransactionReply) {}
    rpc BuildMultisigCancelAsMultiTransaction(BuildMultisigCancelAsMultiRequest) returns (TransactionReply) {}
    rpc SignTransaction(SignTransactionRequest) returns (TransactionReply) {}
    rpc SendTransaction(SendTransactionRequest) returns (TransactionReply) {}
    rpc BuildBatchTransferTransaction(BuildBatchTransferTransactionRequest) returns (TransactionReply) {}
    rpc BuildBatchTransaction(BuildBatchTransactionRequest) returns (TransactionReply) {}
    rpc DecodeTransaction(DecodeTransactionRequest) returns (TransactionParams) {}
    rpc RebuildTransaction(RebuildTransactionRequest) returns (TransactionReply) {}

    // staking
    rpc BuildStakingBondAndNominateTransaction(BuildStakingBondAndNominateTransactionRequest) returns (TransactionReply) {}
    rpc BuildStakingNominateTransaction(BuildStakingNominateTransactionRequest) returns (TransactionReply) {}
    rpc BuildStakingBondExtraTransaction(BuildStakingBondExtraTransactionRequest) returns (TransactionReply) {}
    rpc BuildStakingUnbondTransaction(BuildStakingUnbondTransactionRequest) returns (TransactionReply) {}
    rpc BuildStakingWithdrawUnbondedTransaction(BuildStakingWithdrawUnbondedTransactionRequest) returns (TransactionReply) {}
}