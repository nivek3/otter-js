syntax = "proto3";

package polkadot;
option go_package = "./polkadot";
import "common.proto";

message Network {
	int32 ss58Format = 1;
	string wss = 2;
}

message DeployAccountRequest {
	repeated string keys = 1;
	int32 threshold = 2;
	Network network = 3;
}

message DeployAccountReply {
	string address = 1;
}

message TransferRequest {
	string from = 1;
	string to = 2;
    string quantity = 3;
    Network network = 4;
}

message MultisigTransferRequest {
    string from = 1;
    string to = 2;
    string quantity = 3;
    string sender = 4;
    repeated string pub_keys = 5;
    int32 threshold = 6;
    int32 max_weight = 7;
    Network network = 8;
    
}

message MultisigApproveRequest {
    string from = 1;
    string to = 2;
    string quantity = 3;
    string sender = 4;
    repeated string pub_keys = 5;
    int32 threshold = 6;
    int32 max_weight = 7;
    Network network = 8;
}

message MultisigCancelRequest {
    string from = 1;
    string to = 2;
    string quantity = 3;
    string sender = 4;
    repeated string pub_keys = 5;
    int32 threshold = 6;
    Network network = 7;
}

message SignTransactionRequest {
    string serialized = 1;
    repeated Signature signature = 2;
    Network network = 3;
}

service Polkadot {
    rpc DeployAccount(DeployAccountRequest) returns (DeployAccountReply) {}
    rpc BuildTransferTransaction(TransferRequest) returns (TransactionReply) {}
    rpc BuildMultisigTransaction(MultisigTransferRequest) returns (TransactionReply) {}
    rpc MultisigApproveTransaction(MultisigApproveRequest) returns (TransactionReply) {}
    rpc MultisigCancelTransaction(MultisigCancelRequest) returns (TransactionReply) {}
    rpc SignTransaction(SignTransactionRequest) returns (TransactionReply) {}
}