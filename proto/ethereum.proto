syntax = "proto3";

package ethereum;
option go_package = "./ethereum";
import "common.proto";

message Network {
    string provider  = 1;
    int32 chain_id   = 2;
    string hard_fork = 3;
}

message DeployAccountRequest {
    Network network = 1;
    string key      = 2;
}

message DeployAccountReply {
    string address = 1;
}

message TransactionParams {
    string gas_limit                = 1;
    string gas_price                = 2;
    int32 nonce                     = 3;
    string type                     = 4;
    string max_fee_per_gas          = 5;
    string max_priority_fee_per_gas = 6;
}

message BuildAccountTransactionRequest {
    Network network          = 1;
    repeated string keys     = 2;
    string sender            = 3;
    TransactionParams params = 4;
}

message BuildAccountTransactionReply {
    string address                = 1;
    string serialized             = 2;
    repeated Signature signatures = 3;
}

message BuildTransferTransactionRequest {
    Network network          = 1;
    string from              = 2;
    string to                = 3;
    string quantity          = 4;
    TransactionParams params = 5;
}

message BuildERC20TransferTransactionRequest {
    Network network          = 1;
    string from              = 2;
    string to                = 3;
    string quantity          = 4;
    string token_address     = 5;
    TransactionParams params = 6;
}

message SignTransactionRequest {
    Network network               = 1;
    string serialized             = 2;
    repeated Signature signatures = 3;
}

message SendTransactionRequest {
    Network network   = 1;
    string serialized = 2;
}

message BuildTransactionRequest {
    Network network          = 1;
    string from              = 2;
    string to                = 3;
    string quantity          = 4;
    string data              = 5;
    TransactionParams params = 6;
}

message RebuildTransactionRequest {
    Network network          = 1;
    string serialized        = 2;
    TransactionParams params = 3;
    string from              = 4;  // sender
}

message BuildMultisigTransferInputRequest {
    Network network   = 1;
    string to_address = 2;
    string quantity   = 3;
    string data       = 4;
    int32 expire_time = 5;
    int32 sequence_id = 6;
    string contract   = 7;
}

message BuildMultisigTransferInputReply {
    string serialized             = 1;
    string hash                   = 2;
    repeated Signature signatures = 3;
}

message SignMultisigTransferInputRequest {
    string serialized             = 2;
    repeated Signature signatures = 3;
}

message SignMultisigTransferInputReply {
    string serialized = 1;
}

message BuildMultisigTransferTransactionRequest {
    Network network               = 1;
    string contract               = 2;
    string data                   = 3;
    string sender                 = 4;
    TransactionParams params      = 5;
    string serialized             = 6;
    repeated Signature signatures = 7;
}

message BuildMultisigERC20TransferInputRequest {
    Network network      = 1;
    string token_address = 2;
    string to_address    = 3;
    string quantity      = 4;
    int32 expire_time    = 5;
    int32 sequence_id    = 6;
    string contract      = 7;
}

message SignMultisigERC20TransferInputRequest {
    string serialized             = 2;
    repeated Signature signatures = 3;
}

message HashForSignatureRequest {
    Network network   = 1;
    string serialized = 2;
}

message DecodeTransactionRequest {
    Network network   = 1;
    string serialized = 2;
}

service Ethereum {
    rpc DeployAccount(DeployAccountRequest) returns (DeployAccountReply) {}
    rpc BuildAccountTransaction(BuildAccountTransactionRequest) returns (BuildAccountTransactionReply) {}
    rpc BuildTransferTransaction(BuildTransferTransactionRequest) returns (TransactionReply) {}
    rpc BuildTokenTransferTransaction(BuildERC20TransferTransactionRequest) returns (TransactionReply) {
        option deprecated = true;
    }
    rpc BuildERC20TransferTransaction(BuildERC20TransferTransactionRequest) returns (TransactionReply) {}
    rpc SignTransaction(SignTransactionRequest) returns (TransactionReply) {}
    rpc BuildTransaction(BuildTransactionRequest) returns (TransactionReply) {}
    rpc RebuildTransaction(RebuildTransactionRequest) returns (TransactionReply) {}
    rpc SendTransaction(SendTransactionRequest) returns (TransactionReply) {}
    rpc BuildMultisigTransferInput(BuildMultisigTransferInputRequest) returns (TransactionReply) {}
    rpc SignMultisigTransferInput(SignMultisigTransferInputRequest) returns (TransactionReply) {}
    rpc BuildMultisigTransferTransaction(BuildMultisigTransferTransactionRequest) returns (TransactionReply) {}
    rpc BuildMultisigTokenTransferInput(BuildMultisigERC20TransferInputRequest) returns (TransactionReply) {
        option deprecated = true;
    }
    rpc SignMultisigTokenTransferInput(SignMultisigERC20TransferInputRequest) returns (TransactionReply) {
        option deprecated = true;
    }
    rpc BuildMultisigERC20TransferInput(BuildMultisigERC20TransferInputRequest) returns (TransactionReply) {}
    rpc SignMultisigERC20TransferInput(SignMultisigERC20TransferInputRequest) returns (TransactionReply) {}

    rpc HashForSignature(HashForSignatureRequest) returns (TransactionReply) {}
    rpc DecodeTransaction(DecodeTransactionRequest) returns (TransactionParams) {}
}