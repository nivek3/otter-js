syntax = "proto3";

package ethereum;
option go_package = "./ethereum";
import "common.proto";

message Network {
    string provider = 1;
    int32 chain_id  = 2;
}

message DeployAccountRequest {
    Network network = 1;
    string key      = 2;
}

message DeployAccountReply {
    string address = 1;
}

message TransactionParams {
    string gas_limit = 1;
    string gas_price = 2;
    int32 nonce      = 3;
}

message BuildAccountTransactionRequest {
    Network network          = 1;
    repeated string keys     = 2;
    string sender            = 3;
    TransactionParams params = 4;
}

message BuildAccountTransactionReply {
    string address        = 1;
    string serialized     = 2;
    string signature_hash = 3;
}

message BuildTransferTransactionRequest {
    Network network          = 1;
    string from              = 2;
    string to                = 3;
    string quantity          = 4;
    TransactionParams params = 5;
}

message BuildTokenTransferTransactionRequest {
    Network network          = 1;
    string from              = 2;
    string to                = 3;
    string quantity          = 4;
    string token_address     = 5;
    TransactionParams params = 6;
}

message BuildTokenTransferTransactionReply {
    string serialized     = 1;
    string signature_hash = 2;
}

message SignTransactionRequest {
    Network network              = 1;
    string serialized            = 2;
    repeated Signature signature = 3;
}

message SendTransactionRequest {
    Network network   = 1;
    string serialized = 2;
}

message RebuildTransactionRequest {
    Network network          = 1;
    string serialized        = 2;
    TransactionParams params = 3;
}

message BuildMultisigTransferInputRequest {
    string prefix     = 1;
    string to_address = 2;
    string quantity   = 3;
    string data       = 4;
    int32 expire_time = 5;
    int32 sequence_id = 6;
}

message BuildMultisigTransferInputReply {
    string serialized             = 1;
    string hash                   = 2;
    repeated Signature signatures = 3;
}

message BuildMultisigTransactionRequest {
    Network network          = 1;
    string contract          = 2;
    string to                = 3;
    string quantity          = 4;
    string input             = 5;
    string sender            = 6;
    TransactionParams params = 7;
}

message BuildMultisigTransactionReply {
    string serialized             = 1;
    string hash                   = 2;
    repeated Signature signatures = 3;
}

message SignMultisigTransferInputRequest {
    string serialized             = 2;
    repeated Signature signatures = 3;
}

message SignMultisigTransferInputReply {
    string serialized = 1;
}

service Ethereum {
    rpc DeployAccount(DeployAccountRequest) returns (DeployAccountReply) {}
    rpc BuildAccountTransaction(BuildAccountTransactionRequest) returns (BuildAccountTransactionReply) {}
    rpc BuildTransferTransaction(BuildTransferTransactionRequest) returns (TransactionReply) {}
    rpc BuildTokenTransferTransaction(BuildTokenTransferTransactionRequest) returns (TransactionReply) {}
    rpc SignTransaction(SignTransactionRequest) returns (TransactionReply) {}
    rpc RebuildTransaction(RebuildTransactionRequest) returns (TransactionReply) {}
    rpc SendTransaction(SendTransactionRequest) returns (SendTransactionReply) {}
    rpc BuildMultisigTransferInput(BuildMultisigTransferInputRequest) returns (BuildMultisigTransferInputReply) {}
    rpc SignMultisigTransferInput(SignMultisigTransferInputRequest) returns (SignMultisigTransferInputReply) {}
    rpc BuildMultisigTransaction(BuildMultisigTransactionRequest) returns (BuildMultisigTransactionReply) {}
}