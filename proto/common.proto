syntax = "proto3";

package common;
option go_package = "./common";

message Signature {
    string pub_key = 1;
    string data    = 2;
}

message TransactionReply {
    string serialized                = 1;
    repeated string signature_hashes = 2;
    string hash                      = 3;
}

message BuildTransactionReply {
    string serialized = 1;
    string hash       = 2;
}

message SendTransactionReply {
    string hash = 1;
}