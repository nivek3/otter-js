syntax = "proto3";

package bitcoin;
option go_package = "./bitcoin";
import "common.proto";

message Network {
	string pub_key_hash = 1;
	string script_hash = 2;
    string coin = 3;
}

message DeployAccountRequest {
	repeated string keys = 1;
	int32 required_confirmations = 2;
	Network network = 3;
}

message DeployAccountReply {
	string address = 1;
}

message UTXO {
    int32 vout = 1;
    string txid = 2;
    string script_pub_key = 3;  
    string redeem_script = 4; 
    string witness_script = 5;
    int32 amount = 6;
}

message Target {
    string address = 1;
    int32 value = 2;
}

message BuildTransactionRequest {
    string pub_key = 1;
    string changer = 2;
    repeated Target targets = 3;
    repeated UTXO utxos = 4;
    double fee_rate = 5;
    string redeem_script = 6;
    Network network = 7;
}

message SignTransactionRequest {
    string serialized = 1;
    repeated Signature signature = 2;
    Network network = 3;
}

service BitCoin {
    rpc DeployAccount(DeployAccountRequest) returns (DeployAccountReply) {}
    rpc BuildTransaction(BuildTransactionRequest) returns (TransactionReply) {}
    rpc SignTransaction(SignTransactionRequest) returns (TransactionReply) {}
}