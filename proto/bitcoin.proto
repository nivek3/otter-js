syntax = "proto3";

package bitcoin;
option go_package = "./bitcoin";
import "common.proto";

message Network {
    string pub_key_hash = 1;
    string script_hash  = 2;
    string coin         = 3;
    string provider     = 4;
    int32 dust_limit    = 5;
    string fork_chain   = 6;
    string bech32       = 7;
}

message DeployAccountRequest {
    Network network = 1;
    string key      = 2;
}

message DeployAccountReply {
    string address = 1;
}

message DeployMultisigAccountRequest {
    Network network      = 1;
    repeated string keys = 2;
    int32 threshold      = 3;
}

message DeployMultisigAccountReply {
    string address = 1;
}

// https://chainquery.com/bitcoin-cli/signrawtransactionwithkey
message UnspentTransactionOutput {
    int32 vout              = 1;
    string txid             = 2;
    string prev_out_script  = 3;
    string redeem_script    = 4;
    string witness_script   = 5;
    string amount           = 6;
    repeated string signers = 7;
}

message Recipient {
    string address = 1;
    string value   = 2;
}

message TransactionParams {
    string fee_rate       = 1;
    string fee_mint_block = 2;
}

message BuildTransactionRequest {
    Network network                         = 1;
    string pub_key                          = 2 [deprecated = true];
    string changer                          = 3;
    repeated Recipient recipients           = 4;
    repeated UnspentTransactionOutput utxos = 5;
    TransactionParams params                = 6;
}

message HashForSignatureRequest {
    Network network                         = 1;
    string pub_key                          = 2 [deprecated = true];
    string serialized                       = 3;
    repeated UnspentTransactionOutput utxos = 4;  // required for multisig and wintiness txns
}

message SignTransactionRequest {
    Network network                         = 1;
    string serialized                       = 2;
    repeated Signature signatures           = 3;
    repeated UnspentTransactionOutput utxos = 4;  // required for multisig and wintiness txns
}

message SendTransactionRequest {
    string serialized = 1;
    Network network   = 2;
}

message ScriptPubKey {
    string asm     = 1;
    string hex     = 2;
    string address = 3;
    string type    = 4;
}

message TransactionVin {
    string txid             = 1;
    int32 vout              = 2;
    string type             = 3;
    repeated string witness = 4;
    string sequence         = 5;
    ScriptPubKey script_sig = 6;
}

message TransactionVout {
    string value                = 1;
    ScriptPubKey script_pub_key = 3;
}

message DecodeRawTransactionRequest {
    Network network   = 1;
    string serialized = 2;
}

message DecodeRawTransactionReply {
    string txid                   = 1;
    string hash                   = 2;
    int32 version                 = 3;
    int32 size                    = 4;
    int32 vsize                   = 5;
    int32 weight                  = 6;
    int32 locktime                = 7;
    repeated TransactionVin vin   = 8;
    repeated TransactionVout vout = 9;
}

service Bitcoin {
    rpc DeployAccount(DeployAccountRequest) returns (DeployAccountReply) {}
    rpc DeploySegwitAccount(DeployAccountRequest) returns (DeployAccountReply) {}
    rpc DeployMultisigLegacyAccount(DeployMultisigAccountRequest) returns (DeployMultisigAccountReply) {}
    rpc DeployMultisigSegwitAccount(DeployMultisigAccountRequest) returns (DeployMultisigAccountReply) {}
    rpc BuildTransaction(BuildTransactionRequest) returns (TransactionReply) {}
    rpc HashForSignature(HashForSignatureRequest) returns (TransactionReply) {}
    rpc SignTransaction(SignTransactionRequest) returns (TransactionReply) {}
    rpc SendTransaction(SendTransactionRequest) returns (TransactionReply) {}
    rpc DecodeRawTransaction(DecodeRawTransactionRequest) returns (DecodeRawTransactionReply) {}
}