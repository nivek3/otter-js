syntax = "proto3";

package bitcoin;
option go_package = "./bitcoin";
import "common.proto";

message Network {
	string pubKeyHash = 1;
	string scriptHash = 2;
    string coin = 3;
}

message DeployAccountRequest {
	repeated string keys = 1;
	int32 requiredConfirmations = 2;
	Network network = 3;
}

message DeployAccountReply {
	string address = 1;
}

message UTXO {
    int32 vout = 1;
    string txid = 2;
    string scriptPubKey = 3;  
    string redeemScript = 4; 
    string witnessScript = 5;
    int32 amount = 6;
}

message Target {
    string address = 1;
    int32 value = 2;
}

message BuildTransactionRequest {
	string pubkey = 1;
    string changer = 2;
    repeated Target targets = 3;
    repeated UTXO utxos = 4;
    double feeRate = 5;
    string redeemScript = 6;
    Network network = 7;
}

message SignTransactionRequest {
    string serialized = 1;
    repeated Signature signature = 2;
    Network network = 3;
}

service BitCoin {
    rpc DeployAccount(DeployAccountRequest) returns (DeployAccountReply) {}
    rpc BuildTransaction(BuildTransactionRequest) returns (TransactionReply) {}
    rpc SignTransaction(SignTransactionRequest) returns (TransactionReply) {}
}