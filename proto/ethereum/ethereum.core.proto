syntax = "proto3";

package ethereum.core;

option go_package = "./ethereum/core";

import "./ethereum.common.proto";
import "../common.proto";

message DeployAccountRequest {
    Network network = 1;
    string key      = 2;
}

message DeployAccountReply {
    string address = 1;
}

message BuildTransferTransactionRequest {
    Network network          = 1;
    string from              = 2;
    string to                = 3;
    string quantity          = 4;
    TransactionParams params = 5;
}

message BuildERC20TransferTransactionRequest {
    Network network          = 1;
    string from              = 2;
    string to                = 3;
    string quantity          = 4;
    string token_address     = 5;
    TransactionParams params = 6;
}

message SignTransactionRequest {
    Network network               = 1;
    string serialized             = 2;
    repeated Signature signatures = 3;
}

message SendTransactionRequest {
    Network network   = 1;
    string serialized = 2;
}

message BuildTransactionRequest {
    Network network          = 1;
    string from              = 2;
    string to                = 3;
    string value             = 4;
    string data              = 5;
    TransactionParams params = 6;
}

message RebuildTransactionRequest {
    Network network          = 1;
    string serialized        = 2;
    TransactionParams params = 3;
    string from              = 4;  // sender
}

message HashForSignatureRequest {
    Network network   = 1;
    string serialized = 2;
}

message DecodeTransactionRequest {
    Network network   = 1;
    string serialized = 2;
}

message BuildContractTransactionRequest {
    Network network          = 1;
    TransactionParams params = 2;
    string from              = 3;
    string contract_address  = 4;
    repeated string abi      = 5;
    string method            = 6;
    repeated string args     = 7;
    string value             = 8;
}

message BuildContractExecutionTransactionInputRequest {
    Network network      = 1;
    repeated string abi  = 2;
    string method        = 3;
    repeated string args = 4;
}

message BuildContractExecutionTransactionInputReply {
    string data = 1;
}

message BuildContractCreationTransactionInputRequest {
    Network network      = 1;
    repeated string abi  = 2;
    string bytecode      = 3;
    repeated string args = 4;
}

message BuildContractCreationTransactionInputReply {
    string data = 1;
}

message DecodeRawTransactionRequest {
    Network network   = 1;
    string serialized = 2;
}

message AccessListItem {
    string address               = 1;
    repeated string storage_keys = 2;
};

message DecodeRawTransactionReply {
    string chainId                      = 1;
    string nonce                        = 2;
    string to                           = 3;
    string data                         = 4;
    string value                        = 5;
    string gas_price                    = 6;
    string gas_limit                    = 7;
    string max_priority_fee_per_gas     = 8;
    string max_fee_per_gas              = 9;
    string type                         = 10;
    repeated AccessListItem access_list = 11;
    string r                            = 12;
    string s                            = 13;
    string v                            = 14;
    string from                         = 15;
}

message GetFeeDataRequest {
    Network network = 1;
}

message GetFeeDataReply {
    string gas_price                = 1;
    string max_fee_per_gas          = 2;
    string max_priority_fee_per_gas = 3;
};

service Ethereum {
    rpc DeployAccount(DeployAccountRequest) returns (DeployAccountReply) {}

    rpc BuildTransferTransaction(BuildTransferTransactionRequest) returns (TransactionReply) {}
    rpc BuildERC20TransferTransaction(BuildERC20TransferTransactionRequest) returns (TransactionReply) {}

    rpc SignTransaction(SignTransactionRequest) returns (TransactionReply) {}
    rpc BuildTransaction(BuildTransactionRequest) returns (TransactionReply) {}
    rpc RebuildTransaction(RebuildTransactionRequest) returns (TransactionReply) {}
    rpc SendTransaction(SendTransactionRequest) returns (TransactionReply) {}

    rpc GetFeeData(GetFeeDataRequest) returns (GetFeeDataReply) {}
    rpc HashForSignature(HashForSignatureRequest) returns (TransactionReply) {}
    rpc DecodeTransaction(DecodeTransactionRequest) returns (TransactionParams) {}

    rpc BuildContractCreationTransactionInput(BuildContractCreationTransactionInputRequest) returns (BuildContractCreationTransactionInputReply) {}
    rpc BuildContractExecutionTransactionInput(BuildContractExecutionTransactionInputRequest) returns (BuildContractExecutionTransactionInputReply) {}
    rpc BuildContractTransaction(BuildContractTransactionRequest) returns (TransactionReply) {}

    rpc DecodeRawTransaction(DecodeRawTransactionRequest) returns (DecodeRawTransactionReply) {}
}