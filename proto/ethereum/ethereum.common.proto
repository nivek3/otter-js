syntax = "proto3";

package ethereum.common;

option go_package = "./ethereum/common";

message Network {
    string provider       = 1;
    int32 chain_id        = 2;
    string hard_fork      = 3;
    double base_fee_ratio = 4;
}

message TransactionParams {
    string gas_limit                = 1;
    string gas_price                = 2;
    string nonce                    = 3;
    string type                     = 4;
    string max_fee_per_gas          = 5;
    string max_priority_fee_per_gas = 6;
}