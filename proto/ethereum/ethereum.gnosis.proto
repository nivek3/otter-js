syntax = "proto3";

package ethereum.gnosis;
option go_package = "./ethereum/gnosis";

import "../common.proto";

message Network {
    string provider  = 1;
    int32 chain_id   = 2;
    string hard_fork = 3;
}

message TransactionParams {
    string gas_limit                = 1;
    string gas_price                = 2;
    int32 nonce                     = 3;
    string type                     = 4;
    string max_fee_per_gas          = 5;
    string max_priority_fee_per_gas = 6;
}

message GetAccountAddressRequest {
    Network network      = 1;
    repeated string keys = 2;
    int32 threshold      = 3;
    int64 salt_nonce     = 4;
}

message GetAccountAddressReply {
    string address   = 1;
    int64 salt_nonce = 2;
}

message BuildSafeInputReply {
    string serialized             = 1;
    repeated Signature signatures = 2;
    int32 nonce                   = 3;
}

message BuildAccountTransactionRequest {
    Network network          = 1;
    repeated string keys     = 2;
    int32 threshold          = 3;
    string sender            = 4;
    int64 salt_nonce         = 5;
    TransactionParams params = 6;
}

message BuildAccountTransactionReply {
    string address                = 1;
    string serialized             = 2;
    repeated Signature signatures = 3;
    string estimated_fee          = 4;
}

message BuildMultisigTransferInputRequest {
    Network network              = 1;
    string to_address            = 2;
    string value                 = 3;
    string contract              = 4;
    int32 contract_nonce         = 5;
    string sender                = 6;
    repeated string participants = 7;
}

message SignMultisigInputRequest {
    string serialized             = 1;
    repeated Signature signatures = 2;
}

message BuildMultisigInputRequest {
    Network network              = 1;
    string to                    = 2;
    string value                 = 3;
    string data                  = 4;
    string contract              = 5;
    int32 contract_nonce         = 6;
    string sender                = 7;
    repeated string participants = 8;
}

message BuildMultisigTransactionRequest {
    Network network               = 1;
    string contract               = 2;
    string data                   = 3;
    string value                  = 4;
    string sender                 = 5;
    TransactionParams params      = 6;
    string serialized             = 7;
    repeated Signature signatures = 8;
}

message BuildMultisigERC20TransferInputRequest {
    Network network              = 1;
    string token_address         = 2;
    string to_address            = 3;
    string quantity              = 4;
    string contract              = 5;
    int32 contract_nonce         = 6;
    string sender                = 7;
    repeated string participants = 8;
}

message SafeCall {
    string to       = 1;
    string data     = 2;
    string value    = 3;
    int32 operation = 4;
}

message BuildMultiSendInputRequest {
    Network network              = 1;
    TransactionParams params     = 2;
    repeated SafeCall txs        = 3;
    string value                 = 4;
    string contract              = 5;
    int32 contract_nonce         = 6;
    string sender                = 7;
    repeated string participants = 8;
}

// owner manger
message BuildAddOwnerWithThresholdInputRequest {
    Network network              = 1;
    TransactionParams params     = 2;
    string contract              = 3;
    int32 contract_nonce         = 4;
    string owner                 = 5;
    int32 threshold              = 6;
    string value                 = 7;
    string sender                = 8;
    repeated string participants = 9;
}

message BuildChangeThresholdInputRequest {
    Network network              = 1;
    TransactionParams params     = 2;
    string contract              = 3;
    int32 contract_nonce         = 4;
    int32 threshold              = 5;
    string value                 = 6;
    string sender                = 7;
    repeated string participants = 8;
}

message BuildRemoveOwnerInputRequest {
    Network network              = 1;
    TransactionParams params     = 2;
    string contract              = 3;
    int32 contract_nonce         = 4;
    string prev_owner            = 5;
    string owner                 = 6;
    int32 threshold              = 7;
    string value                 = 8;
    string sender                = 9;
    repeated string participants = 10;
}

message BuildSwapOwnerInputRequest {
    Network network              = 1;
    TransactionParams params     = 2;
    string contract              = 3;
    int32 contract_nonce         = 4;
    string prev_owner            = 5;
    string old_owner             = 6;
    string new_owner             = 7;
    string value                 = 8;
    string sender                = 9;
    repeated string participants = 10;
}
message DecodeTransactionRequest {
    Network network   = 1;
    string serialized = 2;
}

service Ethereum {
    rpc GetAccountAddress(GetAccountAddressRequest) returns (GetAccountAddressReply) {}

    // transcation
    rpc BuildAccountTransaction(BuildAccountTransactionRequest) returns (BuildAccountTransactionReply) {}
    rpc BuildMultisigTransaction(BuildMultisigTransactionRequest) returns (TransactionReply) {}
    rpc DecodeTransaction(DecodeTransactionRequest) returns (TransactionParams) {}

    // input
    rpc BuildMultisigTransferInput(BuildMultisigTransferInputRequest) returns (BuildSafeInputReply) {}
    rpc BuildMultiSendInput(BuildMultiSendInputRequest) returns (BuildSafeInputReply) {}

    rpc BuildMultisigERC20TransferInput(BuildMultisigERC20TransferInputRequest) returns (BuildSafeInputReply) {}
    rpc SignMultisigERC20TransferInput(SignMultisigInputRequest) returns (BuildSafeInputReply) {}
    rpc BuildMultisigInput(BuildMultisigInputRequest) returns (BuildSafeInputReply) {}
    rpc SignMultisigInput(SignMultisigInputRequest) returns (BuildSafeInputReply) {}

    // owner manger input
    rpc BuildAddOwnerWithThresholdInput(BuildAddOwnerWithThresholdInputRequest) returns (BuildSafeInputReply) {}
    rpc BuildChangeThresholdInput(BuildChangeThresholdInputRequest) returns (BuildSafeInputReply) {}
    rpc BuildRemoveOwnerInput(BuildRemoveOwnerInputRequest) returns (BuildSafeInputReply) {}
    rpc BuildSwapOwnerInput(BuildSwapOwnerInputRequest) returns (BuildSafeInputReply) {}
}