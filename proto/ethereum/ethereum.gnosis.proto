syntax = "proto3";

package ethereum.gnosis;
option go_package = "./ethereum/gnosis";

import "./ethereum.common.proto";
import "../common.proto";

message Network {
    string provider  = 1;
    int32 chain_id   = 2;
    string hard_fork = 3;
}

message GetAccountAddressRequest {
    Network network      = 1;
    repeated string keys = 2;
    int32 threshold      = 3;
    int64 salt_nonce     = 4;
}

message GetAccountAddressReply {
    string address   = 1;
    int64 salt_nonce = 2;
    string to        = 3;
    string data      = 4;
}

message BuildSafeInputReply {
    string serialized             = 1;
    repeated Signature signatures = 2;
    int32 nonce                   = 3;
}

message BuildAccountTransactionRequest {
    Network network          = 1;
    repeated string keys     = 2;
    int32 threshold          = 3;
    string sender            = 4;
    int64 salt_nonce         = 5;
    TransactionParams params = 6;
}

message BuildAccountTransactionReply {
    string address                = 1;
    string serialized             = 2;
    repeated Signature signatures = 3;
    string estimated_fee          = 4;
}

message BuildTransferInputRequest {
    Network network              = 1;
    string to_address            = 2;
    string value                 = 3;
    string contract              = 4;
    string contract_nonce        = 5;
    string sender                = 6;
    repeated string participants = 7;  // the participants of the safe who should sign the input
    int32 operation              = 8;
    string safe_tx_gas           = 9;
    string base_gas              = 10;
    string gas_price             = 11;
    string gas_token             = 12;
    string refund_receiver       = 13;
}

message SignInputRequest {
    string serialized             = 1;
    repeated Signature signatures = 2;
}

message BuildInputRequest {
    Network network              = 1;
    string to                    = 2;
    string value                 = 3;
    string data                  = 4;
    string contract              = 5;
    string contract_nonce        = 6;
    string sender                = 7;
    repeated string participants = 8;
    int32 operation              = 9;
    string safe_tx_gas           = 10;
    string base_gas              = 11;
    string gas_price             = 12;
    string gas_token             = 13;
    string refund_receiver       = 14;
}

message BuildTransactionRequest {
    Network network               = 1;
    string contract               = 2;
    string data                   = 3;
    string value                  = 4;
    string sender                 = 5;
    TransactionParams params      = 6;
    string serialized             = 7;
    repeated Signature signatures = 8;
    int32 operation               = 9;
    string safe_tx_gas            = 10;
    string base_gas               = 11;
    string gas_price              = 12;
    string gas_token              = 13;
    string refund_receiver        = 14;
}

message BuildERC20TransferInputRequest {
    Network network              = 1;
    string token_address         = 2;
    string to_address            = 3;
    string quantity              = 4;
    string contract              = 5;
    string contract_nonce        = 6;
    string sender                = 7;
    repeated string participants = 8;
    int32 operation              = 9;
    string safe_tx_gas           = 10;
    string base_gas              = 11;
    string gas_price             = 12;
    string gas_token             = 13;
    string refund_receiver       = 14;
}

message SafeCall {
    string to              = 1;
    string data            = 2;
    string value           = 3;
    int32 operation        = 4;
    string safe_tx_gas     = 5;
    string base_gas        = 6;
    string gas_price       = 7;
    string gas_token       = 8;
    string refund_receiver = 9;
}

message BuildMultiSendInputRequest {
    Network network              = 1;
    TransactionParams params     = 2;
    repeated SafeCall txs        = 3;
    string value                 = 4;
    string contract              = 5;
    string contract_nonce        = 6;
    string sender                = 7;
    repeated string participants = 8;
    string safe_tx_gas           = 9;
    string base_gas              = 10;
    string gas_price             = 11;
    string gas_token             = 12;
    string refund_receiver       = 13;
}

// owner manger
message BuildAddOwnerWithThresholdInputRequest {
    Network network              = 1;
    TransactionParams params     = 2;
    string contract              = 3;
    string contract_nonce        = 4;
    string owner                 = 5;
    int32 threshold              = 6;
    string value                 = 7;
    string sender                = 8;
    repeated string participants = 9;
    int32 operation              = 10;
    string safe_tx_gas           = 11;
    string base_gas              = 12;
    string gas_price             = 13;
    string gas_token             = 14;
    string refund_receiver       = 15;
}

message BuildChangeThresholdInputRequest {
    Network network              = 1;
    TransactionParams params     = 2;
    string contract              = 3;
    string contract_nonce        = 4;
    int32 threshold              = 5;
    string value                 = 6;
    string sender                = 7;
    repeated string participants = 8;
    int32 operation              = 9;
    string safe_tx_gas           = 10;
    string base_gas              = 11;
    string gas_price             = 12;
    string gas_token             = 13;
    string refund_receiver       = 14;
}

message BuildRemoveOwnerInputRequest {
    Network network              = 1;
    TransactionParams params     = 2;
    string contract              = 3;
    string contract_nonce        = 4;
    string prev_owner            = 5;
    string owner                 = 6;
    int32 threshold              = 7;
    string value                 = 8;
    string sender                = 9;
    repeated string participants = 10;
    int32 operation              = 11;
    string safe_tx_gas           = 12;
    string base_gas              = 13;
    string gas_price             = 14;
    string gas_token             = 15;
    string refund_receiver       = 16;
}

message BuildSwapOwnerInputRequest {
    Network network              = 1;
    TransactionParams params     = 2;
    string contract              = 3;
    string contract_nonce        = 4;
    string prev_owner            = 5;
    string old_owner             = 6;
    string new_owner             = 7;
    string value                 = 8;
    string sender                = 9;
    repeated string participants = 10;
}

message DecodeTransactionRequest {
    Network network   = 1;
    string serialized = 2;
}

message EncodeMultiSendRequest {
    Network network       = 1;
    repeated SafeCall txs = 2;
}

message EncodeMultiSendReply {
    string to   = 1;
    string data = 2;
}

service Ethereum {
    rpc GetAccountAddress(GetAccountAddressRequest) returns (GetAccountAddressReply) {}

    // transcation
    rpc BuildAccountTransaction(BuildAccountTransactionRequest) returns (BuildAccountTransactionReply) {}
    rpc BuildTransaction(BuildTransactionRequest) returns (TransactionReply) {}
    rpc DecodeTransaction(DecodeTransactionRequest) returns (TransactionParams) {}

    // input
    rpc BuildTransferInput(BuildTransferInputRequest) returns (BuildSafeInputReply) {}
    rpc BuildMultiSendInput(BuildMultiSendInputRequest) returns (BuildSafeInputReply) {}

    // multisend
    rpc EncodeMultiSend(EncodeMultiSendRequest) returns (EncodeMultiSendReply) {}

    rpc BuildERC20TransferInput(BuildERC20TransferInputRequest) returns (BuildSafeInputReply) {}
    rpc SignERC20TransferInput(SignInputRequest) returns (BuildSafeInputReply) {}
    rpc BuildInput(BuildInputRequest) returns (BuildSafeInputReply) {}
    rpc SignInput(SignInputRequest) returns (BuildSafeInputReply) {}

    // owner manger input
    rpc BuildAddOwnerWithThresholdInput(BuildAddOwnerWithThresholdInputRequest) returns (BuildSafeInputReply) {}
    rpc BuildChangeThresholdInput(BuildChangeThresholdInputRequest) returns (BuildSafeInputReply) {}
    rpc BuildRemoveOwnerInput(BuildRemoveOwnerInputRequest) returns (BuildSafeInputReply) {}
    rpc BuildSwapOwnerInput(BuildSwapOwnerInputRequest) returns (BuildSafeInputReply) {}
}