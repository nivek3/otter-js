version: "3.9"

services:
  cl-wallet-core:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - '${PWD}/logs:/home/node/app/logs:rw'
      - '${PWD}/.env:/home/node/app/.env'
    ports:
      - "13000:3000"
      - "50051:50051"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "50m"